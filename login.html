<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Login — Invenza</title>
  <meta name="theme-color" content="#4F46E5">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/favicon.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">
        <img src="assets/icons/icon-192.png" alt="Logo Invenza">
        <div class="brand-name">Invenza</div>
      </div>

      <div class="auth-title">
        <h1>Selamat Datang Kembali</h1>
        <p>Login untuk mengelola data inventaris Anda.</p>
      </div>

      <div id="login-alert" class="auth-alert"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" class="form-control" placeholder="Masukkan email" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <div class="password-wrap">
            <input type="password" id="login-password" class="form-control" placeholder="Masukkan password" autocomplete="current-password" required>
            <button type="button" class="toggle-password" data-target="login-password">👁</button>
          </div>
        </div>

        <button type="submit" id="login-submit" class="btn btn-primary btn-block">LOGIN</button>
      </form>

      <div class="auth-links">
        <a href="reset-password.html" class="forgot-link">Lupa Password?</a>
        <span class="switch-link">Belum punya akun? <a href="signup.html">Daftar</a></span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
